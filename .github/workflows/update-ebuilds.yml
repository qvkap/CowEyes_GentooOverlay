name: Auto-bump releases

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gentoo ebuild tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Check AyuGram Desktop release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/AyuGram/AyuGramDesktop/releases/latest | jq -r '.tag_name // empty')
          if [ -n "$LATEST_TAG" ]; then
            VERSION=${LATEST_TAG#v}
            TARGET_EBUILD="net-im/ayugram-desktop/ayugram-desktop-${VERSION}.ebuild"
            if [ ! -f "$TARGET_EBUILD" ]; then
              echo "New AyuGram version detected: $VERSION"
              # Find highest existing release ebuild to copy from
              PREV_EBUILD=$(ls -1 net-im/ayugram-desktop/ayugram-desktop-*.ebuild | grep -v '9999' | sort -V | tail -n1)
              cp "$PREV_EBUILD" "$TARGET_EBUILD"
              echo "BUMPED_AYU=true" >> $GITHUB_ENV
              echo "AYU_VER=$VERSION" >> $GITHUB_ENV
            fi
          fi

      - name: Check ElyPrismLauncher release
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/ElyPrismLauncher/Launcher/releases/latest | jq -r '.tag_name // empty')
          if [ -n "$LATEST_TAG" ]; then
            VERSION=${LATEST_TAG#v}
            TARGET_EBUILD="games-action/elyprismlauncher/elyprismlauncher-${VERSION}.ebuild"
            if [ ! -f "$TARGET_EBUILD" ]; then
              echo "New ElyPrismLauncher version detected: $VERSION"
              PREV_EBUILD=$(ls -1 games-action/elyprismlauncher/elyprismlauncher-*.ebuild | grep -v '9999' | sort -V | tail -n1)
              cp "$PREV_EBUILD" "$TARGET_EBUILD"
              echo "BUMPED_ELY=true" >> $GITHUB_ENV
              echo "ELY_VER=$VERSION" >> $GITHUB_ENV
            fi
          fi

      - name: Commit and push changes
        run: |
          if [ "$BUMPED_AYU" = "true" ] || [ "$BUMPED_ELY" = "true" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            MSG="auto: bump"
            [ "$BUMPED_AYU" = "true" ] && MSG="$MSG ayugram-desktop to $AYU_VER"
            [ "$BUMPED_ELY" = "true" ] && MSG="$MSG elyprismlauncher to $ELY_VER"
            git commit -m "$MSG"
            git push
          else
            echo "No new versions found."
          fi
